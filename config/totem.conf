# Explicitly set a 1-hour idle timeout (in ms).
# Using CONFIG_* assignments here ensures they override ZMK's global defaults,
# avoiding Kconfig default-precedence issues in defconfig files.
# Note: CONFIG_ZMK_SLEEP is *not* set here because this file applies to the
# dongle too, which must remain awake. Sleep is enabled for the halves only
# via the conditional defaults in Kconfig.defconfig.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
