when:
  - event: cron
    cron: nightly_update
  - event: manual

steps:
  - name: prepare
    image: bash
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - git config user.email "git@danieln.de"
      - git config user.name "Woodpecker"
      - git config push.default current
      - git config push.autoSetupRemote true
      - git switch -c nightly_update
      - git remote set-url origin https://$${CODEBERG_TOKEN}@codeberg.org/${CI_REPO}

  - name: update flake inputs
    image: bash
    depends_on:
      - prepare
    commands:
      - nix flake update
      - test -n "$(git status --porcelain)" || exit 0
      - git commit -am "update flake inputs"

  - name: update zmk dependencies
    image: bash
    depends_on:
      - prepare
      - update flake inputs
    commands:
      - nix run .#update
      - test -n "$(git status --porcelain)" || exit 0
      - git commit -am "update zmk dependencies"

  - name: push and create pr
    image: bash
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    depends_on:
      - update flake inputs
      - update zmk dependencies
    commands:
      - test "${CI_COMMIT_SHA}" != "$(git rev-parse @)" || exit 0
      - git push -f
      - >-
        NUMBER="$(curl -s -XPOST \
          -H "accept: application/json" \
          -H 'Content-Type: application/json' \
          -H "Authorization: token $${CODEBERG_TOKEN}" \
          -d '{ "base": "main", "head": "nightly_update", "title": "Nightly Update" }' \
          ${CI_FORGE_URL}/api/v1/repos/${CI_REPO}/pulls | jq -r .number)"
      - >-
        curl -s -XPOST \
          -H "accept: application/json" \
          -H 'Content-Type: application/json' \
          -H "Authorization: token $${CODEBERG_TOKEN}" \
          -d '{ "Do": "rebase", "merge_when_checks_succeed": true, "delete_branch_after_merge": true }' \
          ${CI_FORGE_URL}/api/v1/repos/${CI_REPO}/pulls/$${NUMBER}/merge

  - name: latest zmk version
    image: bash
    depends_on:
      - push and create pr
    commands:
      - test "$(curl -s https://api.github.com/repos/zmkfirmware/zmk/releases/latest | jq -r .name)" = "v0.3.0" || exit 1
